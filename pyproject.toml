[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcie-experiments"
version = "0.1.0"
description = "Reproducible data and solver pipeline for Minimal Counterfactual Issue Explanations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcie = "mcie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

