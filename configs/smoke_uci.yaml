dataset: ../data/processed/uci_1984_neutral
beta: "1/4"
alpha: "3/4"
missing_policy: neutral

pair_selection:
  strategy: top_conflict
  count: 3

runs:
  - solver: greedy
    target: AR
    operators: [mod, del]
  - solver: grid-dp
    target: NR
    operators: [mod]
    max_states: 100000
  - solver: ilp
    target: AR
    operators: [mod, del]
    time_limit: 30
  - solver: ilp
    target: NR
    operators: [mod]
    time_limit: 30

output: ../results/smoke_uci

